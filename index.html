<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки. Google для выдачи берёт PNG кратный 48px — SVG он показывает
         не всегда, поэтому PNG идут первыми. SVG остаётся для браузеров. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E03A16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumifield AI — Admission Navigator</title>
    <meta name="description" content="Answer 20 questions and get a personal admission report: matching careers, real universities with deadlines and scholarships, and an essay draft. Free to start." />
    <link rel="canonical" href="https://www.lumifield.app/" />

    <!-- Карточка для мессенджеров и соцсетей: без неё ссылка выглядит голой строкой. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumifield AI" />
    <meta property="og:url" content="https://www.lumifield.app/" />
    <meta property="og:title" content="Know what to study and where to apply" />
    <meta property="og:description" content="Answer 20 questions and get a personal admission report: matching careers, real universities with deadlines, an essay draft. Free to start." />
    <meta property="og:image" content="https://www.lumifield.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lumifield AI — know what to study and where to apply" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Know what to study and where to apply" />
    <meta name="twitter:description" content="Answer 20 questions and get a personal admission report. Free to start." />
    <meta name="twitter:image" content="https://www.lumifield.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
